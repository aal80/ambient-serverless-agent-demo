<!doctype html>
<!-- Served by auth.js before sign-in, so it can't use the protected /static files: styles are inline. -->
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>VoltBay — Sign in</title>
  <style>
    * { box-sizing: border-box; }
    body {
      display: grid;
      place-items: center;
      min-height: 100vh;
      margin: 0;
      font-family: system-ui, -apple-system, sans-serif;
      background: radial-gradient(circle at 50% 30%, #1e1b4b, #0b1120 70%);
      color: #e2e8f0;
    }
    form {
      width: min(380px, calc(100vw - 32px));
      padding: 32px;
      border: 1px solid #1e293b;
      border-radius: 20px;
      background: #111827;
      box-shadow: 0 24px 64px rgb(0 0 0 / 0.5);
    }
    h1 { margin: 0 0 4px; font-size: 22px; }
    p { margin: 0 0 24px; color: #94a3b8; font-size: 14px; }
    label { display: block; margin-bottom: 8px; font-size: 13px; color: #cbd5e1; }
    input {
      width: 100%;
      padding: 12px 14px;
      border: 1px solid #334155;
      border-radius: 10px;
      background: #0b1120;
      color: #e2e8f0;
      font: inherit;
    }
    input:focus { outline: 2px solid #6366f1; border-color: transparent; }
    button {
      width: 100%;
      margin-top: 16px;
      padding: 12px;
      border: 0;
      border-radius: 10px;
      background: #4f46e5;
      color: #fff;
      font: inherit;
      font-weight: 600;
      cursor: pointer;
    }
    button:hover { background: #4338ca; }
    .error {
      margin: 0 0 16px;
      padding: 10px 12px;
      border: 1px solid #7f1d1d;
      border-radius: 10px;
      background: #450a0a;
      color: #fca5a5;
    }
  </style>
</head>
<body>
  <form method="post" action="/login">
    <h1>⚡ VoltBay demo</h1>
    <p>Enter the demo key to continue.</p>
    {{error}}
    <label for="demoKey">Demo key</label>
    <input id="demoKey" name="demoKey" type="password" autocomplete="current-password" required autofocus>
    <input type="hidden" name="next" value="{{next}}">
    <button type="submit">Sign in</button>
  </form>
</body>
</html>
